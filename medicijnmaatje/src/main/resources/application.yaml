spring:
  application:
    name: medicijnmaatje
  data:
    web:
      pageable:
        max-page-size: 100

  datasource:
    url: jdbc:h2:file:./medicijnmaatje/data/medicijnmaatje;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console