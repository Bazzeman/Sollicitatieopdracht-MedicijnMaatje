<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicijn Maatje</title>
    <script src="/js/script.js" defer></script>
</head>
<body>
    <header>
        <h1>Medicijn Maatje</h1>
        <p>Manage your medications.</p>
    </header>
    <main>
        <section>
            <h2 id="form-title">Add medication</h2>
            <form id="medication-form">
                <input type="hidden" id="medication-id">
                <div>
                    <label for="name">Medication name</label>
                    <input type="text" id="name" maxlength="255" placeholder="Paracetamol" required>
                </div>
                <div>
                    <label for="dosage">Dosage</label>
                    <input type="text" id="dosage" placeholder="500 mg" required>
                </div>
                <div>
                    <label for="frequency">Frequency</label>
                    <input type="text" id="frequency" placeholder="2 per day" required>
                </div>
                <button type="submit" id="submit-button">
                    Add medication
                </button>
                <button type="button" id="cancel-button" hidden>
                    Cancel editing
                </button>
            </form>
            <p id="message" role="status"></p>
        </section>
        <section>
            <h2>My medications</h2>
            <div>
                <label for="page-size">Medications per page:</label>
                <select id="page-size">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div>
                <label for="sort-field">Sort by:</label>
                <select id="sort-field">
                    <option value="name">Name</option>
                    <option value="dosage">Dosage</option>
                    <option value="frequency">Frequency</option>
                    <option value="id">ID</option>
                </select>
                <label for="sort-direction">Sort method:</label>
                <select id="sort-direction">
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Dosage</th>
                    <th>Frequency</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="medication-list">
                    <!-- Medications are inserted here by JavaScript -->
                </tbody>
            </table>
            <div>
                <button id="previous-page" type="button">Previous</button>
                <span id="page-information">Page 1 of 1</span>
                <button id="next-page" type="button">Next</button>
            </div>
        </section>
    </main>
</body>
</html>
